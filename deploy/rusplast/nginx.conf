# The host Caddy is the only public entry point and sanitizes forwarding headers.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Caddy terminates HTTPS; relative Location headers preserve that scheme.
    absolute_redirect off;
    error_page 404 /404.html;
    client_max_body_size 16m;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $cms_backend cms:1337;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # CMS/admin lives on cms.rusplast-zavod.ru. Only public API/media share the
    # frontend origin. Preserve Caddy's sanitized client IP, without appending
    # a Docker gateway address that Strapi would mistake for the user.
    location ~ ^/(api|uploads)/ {
        proxy_pass http://$cms_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ (^|/)\. {
        return 404;
    }
    location = / {
        try_files /index.html =404;
    }
    location = /proizvodstvo-stm {
        return 301 '/#about';
    }
    location = /certificates {
        return 301 '/#certificates';
    }
    location = /404 {
        return 404;
    }
    location = /404.html {
        internal;
    }
    location / {
        # These redirects apply only to static routes, never CMS API/media.
        if ($request_uri ~ '^(.+)/index\.html(?:\?|$)') {
            return 308 $1$is_args$args;
        }
        if ($request_uri ~ '^/index\.html(?:\?|$)') {
            return 308 /$is_args$args;
        }
        if ($request_uri ~ '^(.+)\.html(?:\?|$)') {
            return 308 $1$is_args$args;
        }
        if ($request_uri ~ '^(.+)/+(?:\?|$)') {
            return 308 $1$is_args$args;
        }
        # Unknown paths remain real HTTP 404s rather than the homepage.
        try_files $uri.html $uri =404;
    }
}
